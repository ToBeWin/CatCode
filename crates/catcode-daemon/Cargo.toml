[package]
name = "catcode-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "catcode-daemon"
path = "src/main.rs"

[[bin]]
name = "catcode-swe-bench"
path = "src/bin/swe_bench.rs"

[dependencies]
catcode-core = { path = "../catcode-core" }
catcode-provider = { path = "../catcode-provider" }
catcode-tools = { path = "../catcode-tools" }
catcode-context = { path = "../catcode-context" }
catcode-middleware = { path = "../catcode-middleware" }
catcode-sandbox = { path = "../catcode-sandbox" }
catcode-api = { path = "../catcode-api" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dirs = "6"
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
regex = { workspace = true }
lru = { workspace = true }
futures = { workspace = true }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
reqwest = { workspace = true }
tempfile = "3"
tokio-tungstenite = "0.27"
