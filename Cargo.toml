[workspace]
resolver = "2"
members = [
    "crates/catcode-core",
    "crates/catcode-provider",
    "crates/catcode-middleware",
    "crates/catcode-tools",
    "crates/catcode-context",
    "crates/catcode-daemon",
    "crates/catcode-sandbox",
    "crates/catcode-api",
    "crates/catcode-tui",
    "crates/catcode-plugin",
    "crates/catcode-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
futures-core = "0.3"
md-5 = "0.10"
reqwest = { version = "0.12", features = ["json", "stream"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
toml = "0.8"
regex = "1"
